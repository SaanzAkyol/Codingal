<html>
    <head>
        <title>Forms</title>
    </head>
    <body> 
        <center>
        <form>
            <fieldset>
                <legend>Information</legend>
                <label>Username</label>
                <input type="text" placeholder="Enter your name"> <br>
                Password
                <input type="Password" placeholder="Enter your password"> <br>
                Male
                <input type="checkbox"> 
                Female
                <input type="checkbox"> <br>
                Is 18 years above? 
                <input type="radio">
                Minor or major? 
                <input type="radio"> <br>
                Date
                <input type="date"> <br>
                <select>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>

                </select> <br>
                <button>Sign up</button>

            </fieldset>

        </form>
        </center>
    </body>

</html>
